services:
# Develop Container.
  csv-manager-fpm:
    image: hub.bigestionlab.com/docker-images/atomsk-php:php-8.4
    user: atomsk
    command: "php-fpm"
    working_dir: "/var/www/csv-manager"
    volumes:
      - "../:/var/www/csv-manager"
# Tests Containers.
  csv-manager-8-0-test:
    image: hub.bigestionlab.com/docker-images/atomsk-php:php-8.0
    user: atomsk
    working_dir: "/var/www/csv-manager"
    command: sh -c "composer install && composer test"
    volumes:
      - "../:/var/www/csv-manager"
