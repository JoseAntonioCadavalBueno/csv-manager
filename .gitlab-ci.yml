stages:
  - test

# ---------------------------------------
# PHP 8.0
# ---------------------------------------
test-php-8-0-private:
  stage: test
  image: hub.bigestionlab.com/docker-images/atomsk-php:php-8.0
  script:
    - 'composer install'
    - 'composer test'
  allow_failure: true

test-php-8-0-dockerhub:
  stage: test
  image: bigestionlab/atomsk-php:php-8.0
  script:
    - 'composer install'
    - 'composer test'
  needs: [ "test-php-8-0-private" ]

